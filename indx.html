<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PH Tube</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <nav class=" flex w-11/12 mx-auto justify-between py-5">
        <div>
            <img class="w-[150px]" src="./assets/Logo.png" alt="">
        </div>
        <label class="input">
            <input type="search" required placeholder="Search" />
            <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none" stroke="currentColor">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.3-4.3"></path>
                </g>
            </svg>
        </label>
        <div class="sort">
            <button class="btn  btn-primary text-xl ">sort</button>
        </div>
    </nav>
    <nav>
        <div id="categories" class="py-3 gap-5 flex justify-center ">

        </div>
    </nav>
    <main>
        <section>
            <div id="video-container" class=" w-11/12 mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-2 pt-10">
            </div>
        </section>
    </main>
    <script src="./js/index.js"></script>
</body>

</html>
